name: Release

# Push a tag like v0.2.0 to build Arch, Debian and macOS packages and publish
# them as a GitHub release. Manual runs and packaging changes on main build only.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/set-version.mjs"
      - "scripts/smoke-linux-package.sh"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/icons/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arch:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs npm cmake webkit2gtk-4.1 gtk3 ffmpeg deno hicolor-icon-theme \
            dbus python xorg-server-xvfb xorg-xauth xdotool xclip
      - uses: actions/checkout@v4
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg --nodeps --noconfirm
      - name: Verify Arch package
        run: |
          set -- packaging/arch/*.pkg.tar.zst
          test "$#" -eq 1
          bsdtar -tf "$1" > arch-files.txt
          grep -Fx 'usr/bin/youget' arch-files.txt
          grep -Fx 'usr/share/applications/youget.desktop' arch-files.txt
          grep -Fx 'usr/share/icons/hicolor/128x128/apps/youget.png' arch-files.txt
      - name: Smoke-test installed Arch package
        run: |
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          sudo -u builder dbus-run-session -- xvfb-run -a bash scripts/smoke-linux-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Debian (.deb)
    runs-on: ubuntu-latest
    # Built on Debian 12 so the binary runs on Debian 12+ and Ubuntu 24.04+.
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential cmake pkg-config file xz-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            dbus-x11 python3 xvfb xauth xdotool xclip
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run tauri build -- --bundles deb -- --locked
      - name: Verify Debian package
        run: |
          set -- src-tauri/target/release/bundle/deb/*.deb
          test "$#" -eq 1
          test "$(dpkg-deb --field "$1" Architecture)" = amd64
          dpkg-deb --fsys-tarfile "$1" | tar -tf - > deb-files.txt
          grep -Ex '(\./)?usr/bin/youget' deb-files.txt
          grep -Ex '(\./)?usr/share/applications/YouGet.desktop' deb-files.txt
          grep -Ex '(\./)?usr/share/icons/hicolor/128x128/apps/youget.png' deb-files.txt
      - name: Smoke-test installed Debian package
        run: |
          apt-get install -y --no-install-recommends ./src-tauri/target/release/bundle/deb/*.deb
          useradd -m tester
          runuser -u tester -- dbus-run-session -- xvfb-run -a bash scripts/smoke-linux-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  macos:
    name: macOS (.dmg, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg -- --locked
      - name: Verify macOS package
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          set -- "$bundle"/dmg/*.dmg
          test "$#" -eq 1
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$1"
          trap 'hdiutil detach "$mount_dir" >/dev/null && rmdir "$mount_dir"' EXIT
          app="$mount_dir/YouGet.app"
          lipo "$app/Contents/MacOS/youget" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/icon.icns"
          test -L "$mount_dir/Applications"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [arch, debian, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **Arch Linux:** `sudo pacman -U youget-*.pkg.tar.zst`

            **Debian / Ubuntu:** `sudo apt install ./YouGet_*_amd64.deb`

            **macOS (Apple Silicon and Intel):** open the `.dmg` and drag YouGet to Applications.
            If macOS blocks the app, see [Apple’s instructions for approving an app you trust](https://support.apple.com/en-us/102445).

            YouGet downloads and updates yt-dlp by itself on first launch.
