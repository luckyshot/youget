[package]
name = "youget"
version = "0.2.0"
description = "A friendly desktop GUI for yt-dlp"
license = "MIT"
edition = "2021"

[lib]
name = "youget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls", "system-proxy"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
